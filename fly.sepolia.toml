app = 'wolfy-keeper-sepolia'
primary_region = 'sin'

[build]
  dockerfile = "./dockerfiles/keeper.Dockerfile"

[build.args]
  NET="sepolia"


[http_service]
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = "data"
  destination = "../data"
