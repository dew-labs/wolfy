app = 'wolfy-keeper-sepolia'
primary_region = 'iad'

[build]
  dockerfile = "./Dockerfile"

[build.args]
  NET="sepolia"


[http_service]
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
