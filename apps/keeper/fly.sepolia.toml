app = 'freyr-keeper-sepolia'
primary_region = 'iad'

[build]
  dockerfile = './Dockerfile'

  [build.args]
    NET = 'sepolia'

[http_service]
  internal_port = 3001
  force_https = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
