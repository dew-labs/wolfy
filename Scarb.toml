[package]
name = "satoru"
version = "0.1.0"
cairo-version = "2.6.0"
authors = ["Abdelhamid Bakhta <@abdelhamidbakhta>"]
license = "MIT"
keywords = ["starknet", "defi", "syntethics"]
description = "Synthetics platform for Starknet, inspired by GMX v2 design."
documentation = "https://keep-starknet-strange.github.io/satoru/"
homepage = "https://keep-starknet-strange.github.io/satoru/"
repository = "https://github.com/keep-starknet-strange/satoru"
readme = "README.md"
experimental-features = ["negative_impls"]

[scripts]
test = "snforge test"

[[target.starknet-contract]]
sierra = true
casm = true
allowed-libfuncs-list.name = "experimental"

[cairo]
sierra-replace-ids = false

[dependencies]
starknet = ">=2.6.0"
alexandria_data_structures = { git = "https://github.com/keep-starknet-strange/alexandria.git", tag = "cairo-v2.6.0" }
alexandria_math = { git = "https://github.com/keep-starknet-strange/alexandria.git", tag = "cairo-v2.6.0" }
alexandria_storage = { git = "https://github.com/keep-starknet-strange/alexandria.git", tag = "cairo-v2.6.0" }
alexandria_sorting = { git = "https://github.com/keep-starknet-strange/alexandria.git", tag = "cairo-v2.6.0" }
snforge_std = { git = "https://github.com/foundry-rs/starknet-foundry.git", tag = "v0.27.0" }
pragma_lib = { git = "https://github.com/astraly-labs/pragma-lib" }

[tool.snforge]
exit_first = false

[tool.fmt]
sort-module-level-items = false
tab-size = 4 # Obey .editorconfig
max-line-length = 120
