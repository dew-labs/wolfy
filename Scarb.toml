[package]
name = "satoru"
version = "0.1.0"
cairo-version = "2.8.5"
scarb-version = "2.8.5"
authors = ["Abdelhamid Bakhta <@abdelhamidbakhta>"]
license = "MIT"
keywords = ["starknet", "defi", "syntethics"]
description = "Synthetics platform for Starknet, inspired by GMX v2 design."
documentation = "https://keep-starknet-strange.github.io/satoru/"
homepage = "https://keep-starknet-strange.github.io/satoru/"
repository = "https://github.com/keep-starknet-strange/satoru"
readme = "README.md"
experimental-features = ["negative_impls"]

[scripts]
test = "snforge test"

[[target.starknet-contract]]
sierra = true
casm = true
allowed-libfuncs-deny = true

[cairo]
sierra-replace-ids = false

[dependencies]
starknet = "=2.8.5"
alexandria_data_structures = { git = "https://github.com/dew-labs/alexandria.git", tag = "v2.8.2" }
alexandria_math = { git = "https://github.com/dew-labs/alexandria.git", tag = "v2.8.2" }
alexandria_storage = { git = "https://github.com/dew-labs/alexandria.git", tag = "v2.8.2" }
alexandria_sorting = { git = "https://github.com/dew-labs/alexandria.git", tag = "v2.8.2" }
snforge_std = { git = "https://github.com/foundry-rs/starknet-foundry.git", tag = "v0.33.0" }
pragma_lib = { git = "https://github.com/astraly-labs/pragma-lib", tag = "2.8.2" }
openzeppelin = { git = "https://github.com/OpenZeppelin/cairo-contracts.git", tag = "v0.19.0" }

[tool.snforge]
exit_first = false

[tool.fmt]
sort-module-level-items = false
tab-size = 4 # Obey .editorconfig
max-line-length = 120
