[package]
name = "freyr"
version = "0.1.0"
cairo-version = "2.8.5"
scarb-version = "2.8.5"
authors = ["Huynh Duc Duy <@huynhducduy>"]
license = "MIT"
keywords = ["starknet", "defi", "syntethics"]
description = "Synthetics platform for Starknet, inspired by GMX v2 design."
documentation = "https://github.com/dew-labs/wolfy"
homepage = "https://github.com/dew-labs/wolfy"
repository = "https://github.com/dew-labs/wolfy"
readme = "README.md"
edition = "2023_01" # Prelude https://book.cairo-lang.org/appendix-04-cairo-prelude.html https://github.com/starkware-libs/cairo/tree/main/corelib/src/prelude
# experimental-features = ["negative_impls"]

[scripts]
test = "snforge test"

[[target.starknet-contract]]
sierra = true
casm = true

[[profile.dev.target.starknet-contract]]
casm = false # disable casm on dev profile to speed up compilation
allowed-libfuncs-list.name = "experimental" # enable experimental libfuncs

[cairo]
sierra-replace-ids = false # disable sierra replace ids to reduce the size of the contract, with faster compilation time

[profile.release.cairo]
# allow-warnings = false
inlining-strategy = "avoid" # no inlining to reduce the size of the contract
allowed-libfuncs-deny = true

[profile.dev.cairo]
allow-warnings = true
inlining-strategy = "default" # faster compilation
allowed-libfuncs = true # enable experimental libfuncs

# Verbose profile is dev++, with more verbose logs
[profile.verbose.cairo]
allow-warnings = true
inlining-strategy = "default" # faster compilation
allowed-libfuncs = true # enable experimental libfuncs
unstable-add-statements-code-locations-debug-info = true
unstable-add-statements-functions-debug-info = true

[dependencies]
starknet = ">=2.8.5"
alexandria_data_structures = { git = "https://github.com/keep-starknet-strange/alexandria.git", rev = "95d98a5182001d07673b856a356eff0e6bd05354" }
alexandria_math = { git = "https://github.com/keep-starknet-strange/alexandria.git", rev = "95d98a5182001d07673b856a356eff0e6bd05354" }
alexandria_storage = { git = "https://github.com/keep-starknet-strange/alexandria.git", rev = "95d98a5182001d07673b856a356eff0e6bd05354" }
alexandria_sorting = { git = "https://github.com/keep-starknet-strange/alexandria.git", rev = "95d98a5182001d07673b856a356eff0e6bd05354" }
pragma_lib = { git = "https://github.com/astraly-labs/pragma-lib", tag = "2.8.2" }
openzeppelin = "0.19.0"
snforge_std = "0.34.0"

[dev-dependencies]

[tool.snforge]
exit_first = false

[tool.fmt]
sort-module-level-items = true
tab-size = 4 # Obey .editorconfig
max-line-length = 120
