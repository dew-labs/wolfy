name: Deploy Keeper
on:
  push:
    branches:
      - main
    paths:
      - apps/keeper/**
      - packages/shared/**

jobs:
  deploy:
    name: Deploy Keeper
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config apps/keeper/fly.sepolia.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
