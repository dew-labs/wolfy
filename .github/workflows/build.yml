name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["*"]

env:
  SCARB_VERSION: 2.8.5

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}
      - name: Check cairo format
        run: scarb fmt --check
      - name: Build cairo programs
        run: scarb build
